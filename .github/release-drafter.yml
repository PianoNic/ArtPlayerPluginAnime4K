# Releasing, in order:
#
#   1. This drafts a release on every push to main and names it from the labels on the merged pull
#      requests.
#   2. Bump "version" in package.json to the drafted version in a pull request, merge it.
#   3. Publish the draft. That runs publish.yml, which refuses to publish when the tag and
#      package.json disagree, or when npm already has that version.
#
# The draft's target is refs/heads/main, a branch, not a pinned commit: the tag lands on whatever
# main's tip is when you publish.

name-template: 'v$RESOLVED_VERSION'

categories:
  - title: '⚠️ Breaking Changes'
    labels:
      - 'breaking'
      - 'major'
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '✨ Enhancements'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🛠️ Refactors'
    labels:
      - 'refactor'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 CI / Build'
    labels:
      - 'CI/CD'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

no-changes-template: 'No changes in this release.'

# PRE-1.0: `breaking` resolves to MINOR, as semver allows for 0.x. Move `breaking` and `major` into a
# `major:` bucket when the plugin reaches 1.0.
version-resolver:
  minor:
    labels:
      - 'breaking'
      - 'major'
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'refactor'
      - 'enhancement'
  default: patch

# ONLY ON THE VERY FIRST RELEASE: there is no previous tag, so the compare link renders as
# `compare/...v0.1.0`. Replace it in the draft with
# https://github.com/PianoNic/artplayer-plugin-anime4k/commits/v0.1.0 before publishing.
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
